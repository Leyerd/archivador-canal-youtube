<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#cc0000"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#7a0000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- placa con esquinas estilo macOS/superellipse -->
  <rect x="112" y="112" width="800" height="800" rx="190" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="112" y="112" width="800" height="800" rx="190" fill="url(#sheen)"/>

  <!-- triángulo de reproducción -->
  <path d="M430 360 L662 502 a14 14 0 0 1 0 24 L430 668 a16 16 0 0 1 -24 -14 L406 374 a16 16 0 0 1 24 -14 Z"
        fill="#ffffff"/>

  <!-- insignia de descarga -->
  <g transform="translate(648 648)">
    <circle cx="80" cy="80" r="118" fill="#ffffff"/>
    <circle cx="80" cy="80" r="118" fill="none" stroke="#cc0000" stroke-opacity=".10" stroke-width="6"/>
    <g stroke="#cc0000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M80 28 V104"/>
      <path d="M44 78 L80 114 L116 78"/>
      <path d="M40 130 H120"/>
    </g>
  </g>
</svg>
